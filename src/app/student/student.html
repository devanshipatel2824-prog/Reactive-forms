<div class="container mt-5">
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#studentModal" (click)="editStudent = null">
    ADD STUDENT
  </button>

  <!-- Pass Observable to table -->
  <app-table [data]="student$" (edit)="edit($event)" (remove)="deleteStudent($event)"></app-table>

  <!-- Modal for Add/Edit -->
  <div class="modal fade" id="studentModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">{{ editStudent ? 'Edit' : 'Add' }} Student</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <app-form [editData]="editStudent" 
                    (added)="addStudent($event)" 
                    (updated)="updateStudent($event)">
          </app-form>
        </div>
      </div>
    </div>
  </div>
</div>

<button (click)="gotodashboard()">BACK TO DASHBOARD</button>
